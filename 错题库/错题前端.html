<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>408 错题库</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --panel: #fffdf8;
      --ink: #1f2328;
      --muted: #6f6a60;
      --line: #ded8cc;
      --line-strong: #c8c0b3;
      --primary: #264f9f;
      --primary-weak: #e8eefb;
      --danger: #b42318;
      --danger-weak: #fae7e4;
      --gold: #8a6118;
      --gold-weak: #fff2cf;
      --green: #276749;
      --green-weak: #e4f3eb;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(31, 35, 40, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(31, 35, 40, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      backdrop-filter: blur(10px);
    }

    main {
      min-width: 0;
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 7px;
      font-weight: 800;
      color: var(--panel);
      background: var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .sub {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .control {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      outline: none;
    }

    .control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-weak);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 18px 0;
    }

    .stat {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .hint {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ead7a2;
      border-radius: var(--radius);
      background: var(--gold-weak);
      color: var(--gold);
      font-size: 13px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.18;
    }

    .page-title p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toggle {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--panel);
    }

    .toggle button {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle button.active {
      background: var(--ink);
      color: var(--panel);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 0.92fr) minmax(420px, 1.08fr);
      gap: 18px;
      align-items: start;
    }

    .list,
    .detail {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.96);
    }

    .list {
      overflow: hidden;
    }

    .list-head {
      display: grid;
      grid-template-columns: 68px 1fr 88px;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      background: #fbf8f1;
    }

    .row {
      width: 100%;
      display: grid;
      grid-template-columns: 68px 1fr 88px;
      gap: 8px;
      padding: 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }

    .row:hover,
    .row:focus {
      background: var(--primary-weak);
      outline: none;
    }

    .row.active {
      background: var(--ink);
      color: var(--panel);
    }

    .row.active .meta,
    .row.active .tag {
      color: #ddd6ca;
    }

    .qid {
      font-weight: 800;
    }

    .topic {
      min-width: 0;
      font-weight: 700;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      align-self: start;
      justify-self: end;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--danger-weak);
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
    }

    .detail {
      min-height: 620px;
      padding: 22px;
    }

    .detail-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .detail h3 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      text-wrap: pretty;
    }

    .chapter {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .answer {
      min-width: 74px;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--green-weak);
      color: var(--green);
      text-align: center;
      font-weight: 800;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .question {
      margin: 0;
      font-size: 17px;
      line-height: 1.7;
      font-weight: 800;
      text-wrap: pretty;
    }

    .options {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .option {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf0;
      line-height: 1.55;
    }

    .option .letter {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--ink);
      color: var(--panel);
      font-weight: 800;
      font-size: 13px;
    }

    .wrong {
      padding: 12px;
      border: 1px solid #ecc8c3;
      border-radius: var(--radius);
      background: var(--danger-weak);
      color: var(--danger);
      line-height: 1.65;
      font-weight: 700;
    }

    .note {
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf0;
      line-height: 1.7;
      white-space: pre-wrap;
    }

      .review-counter {
        margin-top: 18px;
        padding: 14px;
        border: 1px solid #c8d6b8;
        border-radius: var(--radius);
        background: var(--green-weak);
      }

      .review-counter-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .review-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .review-cell {
        padding: 10px;
        border: 1px solid #c8d6b8;
        border-radius: var(--radius);
        background: rgba(255, 253, 248, 0.8);
      }

      .review-cell strong {
        display: block;
        font-size: 18px;
        line-height: 1.2;
      }

      .review-cell span {
        color: var(--muted);
        font-size: 12px;
      }

      .review-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 0;
        border-radius: var(--radius);
        background: var(--green);
        color: var(--panel);
        font-weight: 800;
        cursor: pointer;
      }

      .review-btn:hover:not(:disabled) {
        filter: brightness(0.94);
      }

      .review-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    code,
    pre {
      font-family: Consolas, "Cascadia Mono", monospace;
    }

    pre {
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f2eee5;
    }

    .compact .detail {
      font-size: 14px;
    }

    .compact .question {
      font-size: 15px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      main {
        padding: 18px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .list-head,
      .row {
        grid-template-columns: 54px 1fr;
      }

      .list-head span:last-child,
      .row .tag {
        display: none;
      }

        .review-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside>
      <div class="brand">
        <div class="brand-mark">408</div>
        <div>
          <h1>错题工作台</h1>
          <p class="sub">按章节、类型、复查日筛题</p>
        </div>
      </div>

      <div class="field">
        <label for="search">搜索</label>
        <input class="control" id="search" type="search" placeholder="题号 / 考点 / 原题关键词">
      </div>

      <div class="field">
        <label for="chapter">王道章节</label>
        <select class="control" id="chapter"></select>
      </div>

      <div class="field">
        <label for="type">错误类型</label>
        <select class="control" id="type"></select>
      </div>

      <div class="field">
        <label for="review">复查日期</label>
        <select class="control" id="review"></select>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="totalCount">0</strong>
          <span>当前题数</span>
        </div>
        <div class="stat">
          <strong id="conceptCount">0</strong>
          <span>概念类</span>
        </div>
      </div>

      <div class="hint">
        新错题流程：先写入 CSV 索引，再追加到对应章节 md。这个前端展示的是当前已录入数据。
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="page-title">
          <h2>408 错题检索</h2>
          <p>把错题当作漏洞地图，不当作惩罚清单。</p>
        </div>
        <div class="toggle" aria-label="显示密度">
          <button type="button" class="active" id="roomyBtn">舒展</button>
          <button type="button" id="compactBtn">紧凑</button>
        </div>
      </div>

      <div class="layout">
        <section class="list" aria-label="错题列表">
          <div class="list-head">
            <span>题号</span>
            <span>考点</span>
            <span>类型</span>
          </div>
          <div id="listBody"></div>
        </section>

        <section class="detail" id="detail" aria-label="错题详情"></section>
      </div>
    </main>
  </div>

  <script>
    const questions = [
      {
        date: "2026-05-05",
        chapter: "第1章 绪论",
        id: "02",
        topic: "算法基本概念",
        type: "概念不清",
        answer: "C",
        review: "2026-05-06",
        question: "下列关于算法的说法中，正确的是。",
        options: {
          A: "算法的时间效率取决于算法执行所花的 CPU 时间",
          B: "在算法设计中不允许用牺牲空间效率的方式来换取好的时间效率",
          C: "算法必须具备有穷性、确定性等五个特性",
          D: "通常用时间效率和空间效率来衡量算法的优劣"
        },
        wrong: "对算法五大特性和算法优劣评价标准的边界不够敏感。",
        note: "算法必须具备有穷性、确定性、可行性、输入、输出五个特性。评价算法效率重点看时间复杂度和空间复杂度，但评价算法优劣不能只看效率。"
      },
      {
        date: "2026-05-05",

      },

        wrong: "忘记卡特兰数公式。",
        note: "C_n = 1 / (n + 1) * C(2n, n)。C3 = 1/4 * C(6,3) = 5。"
      },
      {

        review: "2026-05-09",
        question: "设栈的初始状态为空，当字符序列 a1_ 作为栈的输入时，输出长度为 3，且可用作 C 语言标识符的序列有（ ）个。",
        options: { A: "4", B: "5", C: "3", D: "6" },
        wrong: "没有先用栈规则列出合法出栈序列，再按 C 标识符规则筛选。",
        note: "合法出栈序列：a1_、a_1、1a_、1_a、_1a。可作 C 标识符：a1_、a_1、_1a。"
      },

        options: {

        wrong: "把能通过遍历数出来和能根据队首、队尾指针直接计算出来混在一起。",

      },
      {
        date: "2026-05-08",

        options: {

        },
        wrong: "没有从队列最核心的入队、出队操作成本判断。",
        note: "front + rear 的非循环单链表已经能让队尾入队、队首出队都是 O(1)，循环结构不是必需。"
      },
      {
        date: "2026-05-08",

        type: "概念不清",
        answer: "A",
        review: "2026-05-09",
        question: "在用单链表实现队列时，队头设在链表的（ ）位置。",
        options: { A: "链头", B: "链尾", C: "链中", D: "以上都可以" },
        wrong: "只考虑能不能实现，没有考虑队列出队操作必须高效。",
        note: "队头在链头、队尾在链尾，出队删链头 O(1)，入队接链尾 O(1)。"
      },
      {
        date: "2026-05-08",
        chapter: "第3章 栈队列数组",
        id: "07",
        topic: "递归函数执行顺序",
        type: "过程推导错",
        answer: "C",
        review: "2026-05-09",
        question: "设有如下递归函数，在 func(func(5)) 的执行过程中，第 4 个被执行的 func 函数是（ ）。",
        code: "int func(int x) {\n    if (x <= 3) return 2;\n    else return func(x-2) + func(x-4);\n}",
        options: { A: "func(2)", B: "func(3)", C: "func(4)", D: "func(5)" },
        wrong: "不清楚“被执行”的计数时机。这里每进入一次 func(...) 函数体，就算一个 func 被执行；不是等函数返回时才计数。",
        note: "先算内层 func(5)：第1个 func(5)，随后第2个 func(3)，第3个 func(1)，内层返回 4；外层变成 func(4)，所以第4个执行的是 func(4)。"
      }
    ];

    const state = {
      search: "",
      chapter: "全部",
      type: "全部",
      review: "全部",
      selected: 0
    };

    const els = {
      app: document.getElementById("app"),
      search: document.getElementById("search"),
      chapter: document.getElementById("chapter"),
      type: document.getElementById("type"),
      review: document.getElementById("review"),
      listBody: document.getElementById("listBody"),
      detail: document.getElementById("detail"),
      totalCount: document.getElementById("totalCount"),
      conceptCount: document.getElementById("conceptCount"),
      roomyBtn: document.getElementById("roomyBtn"),
      compactBtn: document.getElementById("compactBtn")
    };

      const STORAGE_KEY = "408-review-counter-v1";
      const reviewData = loadReviewData();

      function loadReviewData() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch {
          return {};
        }
      }

      function saveReviewData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(reviewData));
        } catch {
          // 浏览器禁用本地存储时静默失败，不阻塞页面使用
        }
      }

      function questionKey(q) {
        return `${q.chapter}::${q.id}::${q.topic}`;
      }

      function todayStr() {
        const d = new Date();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${month}-${day}`;
      }

      function toDate(value) {
        return new Date(`${value}T00:00:00`);
      }

      function diffDays(from, to) {
        return Math.round((toDate(to) - toDate(from)) / 86400000);
      }

      function getReviewInfo(q) {
        return reviewData[questionKey(q)] || { count: 0, lastReview: "", prevReview: "" };
      }

      function markReviewed(q) {
        const key = questionKey(q);
        const info = getReviewInfo(q);
        const today = todayStr();

        if (info.lastReview === today) return;

        reviewData[key] = {
          count: (info.count || 0) + 1,
          lastReview: today,
          prevReview: info.lastReview || ""
        };
        saveReviewData();
      }

    function uniq(values) {
      return ["全部", ...Array.from(new Set(values)).sort()];
    }

    function fillSelect(select, values) {
      select.innerHTML = values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function initFilters() {
      fillSelect(els.chapter, uniq(questions.map(q => q.chapter)));
      fillSelect(els.type, uniq(questions.flatMap(q => q.type.split(";"))));
      fillSelect(els.review, uniq(questions.map(q => q.review)));
    }

    function filteredQuestions() {
      const keyword = state.search.trim().toLowerCase();
      return questions.filter(q => {
        const haystack = [q.id, q.topic, q.chapter, q.question, q.type, q.answer].join(" ").toLowerCase();
        const bySearch = !keyword || haystack.includes(keyword);
        const byChapter = state.chapter === "全部" || q.chapter === state.chapter;
        const byType = state.type === "全部" || q.type.split(";").includes(state.type);
        const byReview = state.review === "全部" || q.review === state.review;
        return bySearch && byChapter && byType && byReview;
      });
    }

      function reviewLabel(q) {
        const info = getReviewInfo(q);
        if (!info.lastReview) return "未记录复习";
        const days = diffDays(info.lastReview, todayStr());
        return `距上次复习 ${days} 天`;
      }

    function renderList() {
      const items = filteredQuestions();
      els.totalCount.textContent = items.length;
      els.conceptCount.textContent = items.filter(q => q.type.includes("概念不清")).length;

      if (state.selected >= items.length) state.selected = 0;

      if (!items.length) {
        els.listBody.innerHTML = `<div class="empty">没有匹配的错题。</div>`;
        renderDetail(null);
        return;
      }

      els.listBody.innerHTML = items.map((q, index) => `
        <button class="row ${index === state.selected ? "active" : ""}" type="button" data-index="${index}">
          <div class="qid">#${escapeHtml(q.id)}</div>
          <div class="topic">
            ${escapeHtml(q.topic)}
            <div class="meta">${escapeHtml(q.chapter)} · 复查 ${escapeHtml(q.review)} · ${escapeHtml(reviewLabel(q))}</div>
          </div>
          <div class="tag">${escapeHtml(q.type.split(";")[0])}</div>
        </button>
      `).join("");

      els.listBody.querySelectorAll(".row").forEach(row => {
        row.addEventListener("click", () => {
          state.selected = Number(row.dataset.index);
          renderList();
        });
      });

      renderDetail(items[state.selected]);
    }

    function renderOptions(options) {
      if (!options) return "";
      return `
        <div class="options">
          ${Object.entries(options).map(([letter, text]) => `
            <div class="option">
              <div class="letter">${escapeHtml(letter)}</div>
              <div>${escapeHtml(text)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

      function renderReviewCounter(q) {
        const info = getReviewInfo(q);
        const today = todayStr();
        const lastReview = info.lastReview || "未记录";
        const daysSince = info.lastReview ? diffDays(info.lastReview, today) : "—";
        const interval = info.lastReview && info.prevReview ? diffDays(info.prevReview, info.lastReview) : "—";
        const reviewedToday = info.lastReview === today;

        return `
          <div class="review-counter">
            <p class="review-counter-title">复习计数器</p>
            <div class="review-grid">
              <div class="review-cell"><strong>${escapeHtml(info.count || 0)}</strong><span>复习次数</span></div>
              <div class="review-cell"><strong>${escapeHtml(daysSince)}</strong><span>距上次复习（天）</span></div>
              <div class="review-cell"><strong>${escapeHtml(interval)}</strong><span>上次间隔（天）</span></div>
              <div class="review-cell"><strong>${escapeHtml(lastReview)}</strong><span>最近复习</span></div>
            </div>
            <button class="review-btn" type="button" ${reviewedToday ? "disabled" : ""}>
              ${reviewedToday ? "今天已复习" : "✅ 今天复习了"}
            </button>
          </div>
        `;
      }

    function renderDetail(q) {
      if (!q) {
        els.detail.innerHTML = `<div class="empty">调整筛选条件后查看错题详情。</div>`;
        return;
      }

      const statements = q.statements ? `
        <div class="section">
          <p class="section-title">题干说法</p>
          <p class="note">${escapeHtml(q.statements.join("\n"))}</p>
        </div>
      ` : "";

      const code = q.code ? `
        <div class="section">
          <p class="section-title">代码</p>
          <pre>${escapeHtml(q.code)}</pre>
        </div>
      ` : "";

      const table = q.table ? `
        <div class="section">
          <p class="section-title">表格信息</p>
          <pre>${escapeHtml(q.table)}</pre>
        </div>
      ` : "";

      els.detail.innerHTML = `
        <div class="detail-header">
          <div>
            <h3>#${escapeHtml(q.id)} ${escapeHtml(q.topic)}</h3>
            <div class="chapter">${escapeHtml(q.chapter)} · ${escapeHtml(q.date)} · ${escapeHtml(q.type)}</div>
          </div>
          <div class="answer">答案 ${escapeHtml(q.answer)}</div>
        </div>

        <div class="section">
          <p class="section-title">原题</p>
          <p class="question">${escapeHtml(q.question)}</p>
        </div>

        ${code}
        ${statements}
        ${table}

        <div class="section">
          <p class="section-title">选项</p>
          ${renderOptions(q.options)}
        </div>

        <div class="section">
          <p class="section-title">错误原因</p>
          <div class="wrong">${escapeHtml(q.wrong)}</div>
        </div>

        <div class="section">
          <p class="section-title">复盘结论</p>
          <p class="note">${escapeHtml(q.note)}</p>
        </div>

          ${renderReviewCounter(q)}
      `;
        const reviewBtn = els.detail.querySelector(".review-btn");
        if (reviewBtn) {
          reviewBtn.addEventListener("click", () => {
            markReviewed(q);
            renderList();
          });
        }
    }


    function bindEvents() {
      els.search.addEventListener("input", event => {
        state.search = event.target.value;
        state.selected = 0;
        renderList();
      });
      els.chapter.addEventListener("change", event => {
        state.chapter = event.target.value;
        state.selected = 0;
        renderList();
      });
      els.type.addEventListener("change", event => {
        state.type = event.target.value;
        state.selected = 0;
        renderList();
      });
      els.review.addEventListener("change", event => {
        state.review = event.target.value;
        state.selected = 0;
        renderList();
      });
      els.roomyBtn.addEventListener("click", () => {
        els.app.classList.remove("compact");
        els.roomyBtn.classList.add("active");
        els.compactBtn.classList.remove("active");
      });
      els.compactBtn.addEventListener("click", () => {
        els.app.classList.add("compact");
        els.compactBtn.classList.add("active");
        els.roomyBtn.classList.remove("active");
      });
    }

    initFilters();
    bindEvents();
    renderList();
  </script>
</body>
</html>
